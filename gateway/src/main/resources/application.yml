server:
  port: 8090

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: ai-service
              uri: "${AI_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/api/v1/ai/**

            - id: demo-ingestion
              uri: "${INGESTION_SERVICE_URL:http://localhost:8080}"
              predicates:
                - Path=/metering/**

            - id: quota-service
              uri: "${QUOTA_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/v1/quota/**

            - id: quota-service-tenants
              uri: "${QUOTA_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/v1/tenants/*/quota

            - id: quota-service-tenants-config
              uri: "${QUOTA_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/v1/tenants/*/quota/config

            - id: project-service
              uri: "${PROJECT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/v1/admin/**,/api/v1/tenants/**

            - id: auth-service
              uri: "${PROJECT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info