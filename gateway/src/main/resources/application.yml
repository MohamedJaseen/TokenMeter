server:
  port: 8090

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: ai-service
              uri: http://${AI_HOST:localhost}:${AI_PORT:8083}
              predicates:
                - Path=/api/v1/ai/**

            - id: demo-ingestion
              uri: http://${INGESTION_HOST:localhost}:${INGESTION_PORT:8080}
              predicates:
                - Path=/metering/**

            - id: quota-service
              uri: http://${QUOTA_HOST:localhost}:${QUOTA_PORT:8082}
              predicates:
                - Path=/api/v1/quota/**

            - id: quota-service-tenants
              uri: http://${QUOTA_HOST:localhost}:${QUOTA_PORT:8082}
              predicates:
                - Path=/api/v1/tenants/*/quota

            - id: quota-service-tenants-config
              uri: http://${QUOTA_HOST:localhost}:${QUOTA_PORT:8082}
              predicates:
                - Path=/api/v1/tenants/*/quota/config

            - id: project-service
              uri: http://${PROJECT_HOST:localhost}:${PROJECT_PORT:8081}
              predicates:
                - Path=/api/v1/admin/**,/api/v1/tenants/**

            - id: auth-service
              uri: http://${PROJECT_HOST:localhost}:${PROJECT_PORT:8081}
              predicates:
                - Path=/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info