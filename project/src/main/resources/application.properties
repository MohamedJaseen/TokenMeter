server.port=${PROJECT_SERVER_PORT:8081}
spring.data.redis.host=localhost
spring.data.redis.port=6379

quota.service.url=http://localhost:8082



spring.datasource.url=jdbc:postgresql://localhost:5432/Billing?connectionTimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}

app.quota.internal-token=${QUOTA_INTERNAL_TOKEN:}

payment.manual.qr-image-url=${MANUAL_PAYMENT_QR_IMAGE_URL:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.payment-admin=${PAYMENT_ADMIN_EMAIL:jaseen132219@gmail.com}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false