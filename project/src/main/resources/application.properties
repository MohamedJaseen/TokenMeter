server.port=${PROJECT_SERVER_PORT:8081}
spring.data.redis.host=localhost
spring.data.redis.port=6379

quota.service.url=http://localhost:8082



spring.datasource.url=jdbc:postgresql://localhost:5432/Billing?connectionTimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}

app.quota.internal-token=${QUOTA_INTERNAL_TOKEN:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always