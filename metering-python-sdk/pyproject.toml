[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metering-sdk"
version = "0.1.0"
description = "Python SDK for the Metering & Billing platform (AI metering, quota, billing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Metering Platform", email = "dev@metering.io" }]
keywords = ["metering", "billing", "ai", "quota", "sdk", "gemini"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://metering.io"
Documentation = "https://metering.io/docs/sdk/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
