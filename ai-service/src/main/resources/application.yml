server:
  port: ${AI_SERVER_PORT:8083}

spring:
  application:
    name: ai-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Billing?connectionTimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

ai:
  default-provider: ${AI_DEFAULT_PROVIDER:GEMINI}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
    model: ${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  mistral:
    api-key: ${MISTRAL_API_KEY:}
    base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai/v1}
    model: ${MISTRAL_MODEL:mistral-small-latest}

metering:
  ingestion-url: ${METERING_INGESTION_URL:http://demo:8080/metering/usage}

management:
  endpoints:
    web:
      exposure:
        include: health,info